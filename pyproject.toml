[project]
name = "qtox-telegram-bridge"
version = "0.1.0"
description = "Headless Tox bridge that mirrors qTox conversations into Telegram private-chat topics"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "GPL-3.0-or-later"
authors = [{ name = "stabby", email = "stabbydev@pm.me" }]
keywords = ["tox", "telegram", "bridge", "qtox", "bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Operating System :: POSIX",
]
dependencies = [
    "aiogram==3.28.2",
    "aiosqlite>=0.20,<0.22",
]

[project.urls]
Homepage = "https://github.com/stabbyjs/qtox-telegram-bridge"
Repository = "https://github.com/stabbyjs/qtox-telegram-bridge"
Issues = "https://github.com/stabbyjs/qtox-telegram-bridge/issues"

[project.optional-dependencies]
# Tox binding is built from git and needs system libtoxcore - installed in Docker,
# not pulled here so that core unit tests run without native deps.
tox = [
    "py-toxcore-c @ git+https://github.com/TokTok/py-toxcore-c.git",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["bridge"]
# app/__main__/nodes держат реальные сеть и сборку - их покрываем интеграционно,
# а не юнит-тестами.
omit = [
    "src/bridge/app.py",
    "src/bridge/__main__.py",
    "src/bridge/nodes.py",
]
