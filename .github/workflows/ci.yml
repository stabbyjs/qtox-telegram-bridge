name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # setup-uv уже создаёт .venv, поэтому пересоздаём с нужной версией Python.
      - name: Create virtualenv
        env:
          PYV: ${{ matrix.python-version }}
        run: uv venv --python "$PYV" --clear

      - name: Install package with dev extras
        run: uv pip install -e ".[dev]"

      - name: Run tests
        run: .venv/bin/python -m pytest -q --cov=bridge --cov-report=term-missing

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build .
