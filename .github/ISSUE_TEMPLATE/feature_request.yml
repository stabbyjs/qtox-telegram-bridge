name: Запрос фичи
description: Предложить новую возможность или улучшение моста qTox → Telegram
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что нашёл время предложить идею. Чтобы её было проще обсудить
        и оценить, опиши не только *что* добавить, но и *зачем* - какая боль за
        этим стоит. Пара абзацев живого текста ценнее формального списка.

        Перед отправкой загляни в [открытые issue](../issues) - возможно, про
        это уже думают, и тогда лучше поддержать существующее обсуждение.

  - type: textarea
    id: problem
    attributes:
      label: Проблема или потребность
      description: >-
        С чем именно ты столкнулся? Чего не хватает сегодня? Опиши ситуацию,
        а не сразу готовое решение - так проще найти лучший вариант.
      placeholder: |
        Например: когда собеседник присылает файл больше 20 МБ, мост молча
        ничего не делает, и я даже не понимаю, что сообщение вообще было.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
      description: >-
        Как ты это видишь? Что должно происходить с точки зрения пользователя?
        Если есть мысли про реализацию - тоже пиши, но необязательно.
      placeholder: |
        Например: при превышении лимита бот отправляет в топик короткую плашку
        "файл слишком большой (35 МБ), Tox-сторона уведомлена" и предлагает
        попросить собеседника пережать.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
      description: >-
        Что ты уже пробовал или обдумывал? Какие обходные пути есть сейчас и
        почему они не устраивают? Если альтернатив не было - так и напиши.
      placeholder: |
        Например: сейчас приходится держать рядом открытый qTox только ради
        больших файлов - это рушит весь смысл headless-моста.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Контекст
      description: >-
        Всё, что поможет понять идею: как ты используешь мост, версия,
        окружение (Docker/локально), скриншоты, логи, ссылки на смежные issue.
      placeholder: |
        Например: запускаю через docker compose на VPS, один профиль, около
        десятка активных диалогов. Логи прикладываю.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Проверки перед отправкой
      options:
        - label: Я поискал среди открытых issue и не нашёл дубликата
          required: true
        - label: Это про сам мост, а не про qTox, Tox-сеть или Telegram как таковые
          required: true
